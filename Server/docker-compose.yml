services:
  mc-metrics-bridge:
    build: .
    container_name: mc-metrics-bridge
    restart: unless-stopped
    environment:
      PORT: "5000"
      SECRET_TOKEN: "CHANGE_THIS_TOKEN"
      STALE_SECONDS: "30"
      CLEANUP_INTERVAL: "30"
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - monitoring_default

networks:
   monitoring_default:
    external: true
