name: MC-Metrics
version: '1.0.8'
main: de.roaring20s.metrics.ServerMetricsPlugin
api-version: '1.20'
author: Damian31101, Roaring20s
description: Collects server/system metrics and sends them via HTTP POST (JSON) to a central collection server.
folia-supported: false

commands:
  mcmetrics:
    description: Reload the MC-Metrics configuration
    usage: /mcmetrics reload
    permission: mcmetrics.reload

permissions:
  mcmetrics.reload:
    description: Allows reloading the MC-Metrics configuration
    default: op
